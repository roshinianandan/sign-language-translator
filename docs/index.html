
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Sign Language Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🤟 Sign Language Translator</h1>
    <p id="status">Loading model…</p>
  </header>

  <main>
    <div class="stage">
      <canvas id="view"></canvas>
      <video id="cam" playsinline muted hidden></video>
      <div id="current">–</div>
    </div>

    <div id="caption" aria-live="polite">
      Tap Start and begin signing
    </div>

    <div class="controls">
      <button id="start" class="primary" disabled>
        ▶ Start camera
      </button>
      <button id="speak">🔊 Speak</button>
      <button id="clear">✖ Clear</button>
      <label class="toggle">
        <input type="checkbox" id="auto" checked>
        Auto-speak
      </label>
    </div>

    <div id="bars"></div>
    <div id="guide" hidden></div>

    <section id="vocabulary">
      <h2>Sign Language Vocabulary</h2>
      <p>Explore the 150-word vocabulary list.</p>

      <input
        id="wordSearch"
        type="search"
        placeholder="Search words..."
        aria-label="Search vocabulary"
      >

      <p id="wordCount">Loading vocabulary...</p>
      <div id="wordList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
    crossorigin="anonymous">
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"
    crossorigin="anonymous">
  </script>

  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
